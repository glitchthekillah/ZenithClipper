name: release
# Builds every download and attaches it to the GitHub release for the tag:
#   Windows: installer (setup.exe) and portable zip.  Linux: AppImage, .deb and tar.gz.  Plus SHA256SUMS.
# Create a draft (gh release create vX.Y.Z --draft --notes-file ...), then run this workflow for the tag (gh workflow run release.yml -f tag=vX.Y.Z).
# It can also be run by hand for an existing tag.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build, for example v1.0.0
        required: true
permissions:
  contents: write
env:
  TAG: ${{ github.event.release.tag_name || inputs.tag }}
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Stamp version
        shell: pwsh
        run: |
          $v = "$env:TAG".TrimStart('v')
          (Get-Content Directory.Build.props -Raw) -replace '<Version>[^<]*</Version>', "<Version>$v</Version>" | Set-Content Directory.Build.props -NoNewline
      - name: Fetch FFmpeg
        shell: pwsh
        run: |
          $zip = "$env:RUNNER_TEMP\ffmpeg.zip"
          Invoke-WebRequest https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip -OutFile $zip
          Expand-Archive $zip tools/ffmpeg-package -Force
      # The editor bundles MLT from the official Shotcut portable build (same version as local development).
      - name: Fetch MLT runtime
        shell: pwsh
        run: |
          $zip = "$env:RUNNER_TEMP\shotcut.zip"
          Invoke-WebRequest https://github.com/mltframework/shotcut/releases/download/v26.9.27/shotcut-win64-26.9.27.zip -OutFile $zip
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash
          if ($hash -ne '1F8C50CE7B125A2F0DCB60777B358E86BAF03B8515982612B6ADAE10A83D93A5') { throw "Shotcut archive checksum mismatch: $hash" }
          Expand-Archive $zip tools/mlt-runtime/package -Force
          if (!(Test-Path tools/mlt-runtime/package/Shotcut/libmlt-7.dll)) { throw 'libmlt-7.dll not where build-editor.ps1 expects it.' }
      - name: Build
        shell: pwsh
        run: ./scripts/package-windows.ps1
      # Layout matters: the editor finds its .NET runtime at ..\windows\runtime and the panel finds the editor at ..\editor.
      - name: Portable zip and installer
        shell: pwsh
        run: |
          $version = "$env:TAG".TrimStart('v')
          $root = "dist/ZenithClipper"
          New-Item -ItemType Directory -Force "$root/windows", "$root/editor" | Out-Null
          Copy-Item build/windows/* "$root/windows" -Recurse -Force
          Copy-Item build/editor/* "$root/editor" -Recurse -Force
          Get-ChildItem $root -Recurse -Filter *.pdb | Remove-Item
          Copy-Item README.md, THIRD_PARTY.md $root -Force
          Set-Content "$root/ZenithClipper.cmd" "@echo off`r`nstart `"`" `"%~dp0windows\ZenithClipper.Windows.exe`" panel" -Encoding ascii
          Set-Content "$root/ZenithClipper Editor.cmd" "@echo off`r`nstart `"`" `"%~dp0windows\ZenithClipper.Windows.exe`" editor" -Encoding ascii
          Compress-Archive "$root" "dist/ZenithClipper_${version}_x64-portable.zip" -CompressionLevel Optimal
          choco install innosetup -y --no-progress | Out-Null
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /Qp "/DAppVersion=$version" "/DSourceRoot=$((Resolve-Path $root).Path)" "/DOutputDir=$((Resolve-Path dist).Path)" installer/ZenithClipper.iss
          if ($LASTEXITCODE) { throw "Installer build failed ($LASTEXITCODE)" }
          Get-ChildItem dist -File | Format-Table Name, Length
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/*.zip
            dist/*-setup.exe

  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build
        run: |
          set -euo pipefail
          version="${TAG#v}"
          sed -i "s#<Version>[^<]*</Version>#<Version>${version}</Version>#" Directory.Build.props
          root="dist/zenithclipper-${version}-linux-x64"
          mkdir -p "$root/app/linux" "$root/editor"
          # Self-contained: no .NET install needed. The engine finds its helpers in app/linux and the editor at ../editor.
          dotnet publish src/ZenithClipper.App -c Release -r linux-x64 --self-contained true -p:PublishSingleFile=false -o "$root/app"
          dotnet publish src/ZenithClipper.Editor.Desktop -c Release -r linux-x64 --self-contained true -o "$root/editor"
          find "$root" -name '*.pdb' -delete
          cp linux/*.py linux/*.sh "$root/app/linux/"
          cp README.md THIRD_PARTY.md docs/LINUX.md "$root/"
          cat > "$root/zenithclipper" <<'EOF'
          #!/usr/bin/env bash
          # ZenithClipper launcher: "zenithclipper" opens the controls, "zenithclipper daemon" starts recording,
          # "zenithclipper editor" opens the editor, "zenithclipper save 30" saves the last 30 seconds.
          here="$(cd -- "$(dirname -- "$(readlink -f -- "${BASH_SOURCE[0]}")")" && pwd)"
          exec "$here/app/zenithclipper" "${@:-panel}"
          EOF
          sed -i 's/^          //' "$root/zenithclipper"
          chmod +x "$root/zenithclipper" "$root/app/zenithclipper" "$root/editor/ZenithClipper.Editor" "$root"/app/linux/*.sh
          tar -C dist -czf "dist/zenithclipper-${version}-linux-x64.tar.gz" "zenithclipper-${version}-linux-x64"
      - name: Debian package
        run: |
          set -euo pipefail
          version="${TAG#v}"
          pkg="dist/deb"
          mkdir -p "$pkg/DEBIAN" "$pkg/opt" "$pkg/usr/bin" "$pkg/usr/share/applications" "$pkg/usr/share/icons/hicolor/256x256/apps"
          cp -r "dist/zenithclipper-${version}-linux-x64" "$pkg/opt/zenithclipper"
          ln -s /opt/zenithclipper/zenithclipper "$pkg/usr/bin/zenithclipper"
          if [ -f assets/zenithclipper.png ]; then cp assets/zenithclipper.png "$pkg/usr/share/icons/hicolor/256x256/apps/zenithclipper.png"; fi
          printf '[Desktop Entry]\nType=Application\nName=ZenithClipper\nComment=Instant replay recorder\nExec=zenithclipper panel\nIcon=zenithclipper\nCategories=AudioVideo;Recorder;\nTerminal=false\n' > "$pkg/usr/share/applications/zenithclipper.desktop"
          printf '[Desktop Entry]\nType=Application\nName=ZenithClipper Editor\nComment=Trim and edit your clips\nExec=zenithclipper editor\nIcon=zenithclipper\nCategories=AudioVideo;Video;AudioVideoEditing;\nTerminal=false\n' > "$pkg/usr/share/applications/zenithclipper-editor.desktop"
          size=$(du -sk "$pkg" | cut -f1)
          cat > "$pkg/DEBIAN/control" <<EOF
          Package: zenithclipper
          Version: ${version}
          Architecture: amd64
          Maintainer: glitchthekillah <noreply@github.com>
          Installed-Size: ${size}
          Depends: ffmpeg, python3, zenity, pulseaudio-utils, xdg-utils, libmlt7, libmlt-data
          Recommends: python3-gi, gir1.2-gstreamer-1.0, gstreamer1.0-pipewire, gstreamer1.0-plugins-good, gstreamer1.0-plugins-bad
          Homepage: https://github.com/glitchthekillah/ZenithClipper
          Description: Instant replay recorder with a built-in clip editor
           Keeps the last minutes of your screen in a rolling buffer and saves a clip on a hotkey.
          EOF
          sed -i 's/^          //' "$pkg/DEBIAN/control"
          dpkg-deb --root-owner-group --build "$pkg" "dist/zenithclipper_${version}_amd64.deb"
          ls -la dist
      - name: AppImage
        run: |
          version="${TAG#v}"
          bash scripts/build-appimage.sh "$version" "dist/zenithclipper-${version}-linux-x64" dist
          # Smoke test from inside the AppImage with no system MLT: the editor must start on the bundled copy.
          sudo apt-get remove -y -qq libmlt7 libmlt-data frei0r-plugins >/dev/null
          cd dist && "./ZenithClipper-${version}-x86_64.AppImage" --appimage-extract >/dev/null
          here="$PWD/squashfs-root"
          env LD_LIBRARY_PATH="$here/usr/lib" MLT_REPOSITORY="$here/usr/lib/mlt-7" MLT_DATA="$here/usr/share/mlt-7" MLT_PROFILES_PATH="$here/usr/share/mlt-7/profiles" FREI0R_PATH="$here/usr/lib/frei0r-1" \
            timeout 300 "$here/usr/lib/zenithclipper/editor/ZenithClipper.Editor" --headless-smoke | tail -3
          rm -rf squashfs-root
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            dist/*.tar.gz
            dist/*.deb
            dist/*.AppImage

  publish:
    needs: [windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: files
          merge-multiple: true
      - name: Checksums
        run: |
          cd files
          sha256sum * > SHA256SUMS
          cat SHA256SUMS
      # Attaches to the existing release (keeps its author, title and notes); creates one only for a manual run.
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          files: files/*
          # Releases are created as drafts and only go public here, once every file is attached.
          draft: false
          make_latest: true
