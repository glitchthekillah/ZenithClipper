name: release
# Builds the full Windows package (panel, engine, NVIDIA recorder, editor) and attaches it to a GitHub release.
# Push a tag like v1.0.0 to publish; run it by hand to just get the zip as a build artifact.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      # MSVC for the native recorder and nvenc_shim.dll.
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Fetch FFmpeg
        shell: pwsh
        run: |
          $zip = "$env:RUNNER_TEMP\ffmpeg.zip"
          Invoke-WebRequest https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip -OutFile $zip
          Expand-Archive $zip tools/ffmpeg-package -Force
      # The editor bundles MLT from the official Shotcut portable build (same version as local development).
      - name: Fetch MLT runtime
        shell: pwsh
        run: |
          $zip = "$env:RUNNER_TEMP\shotcut.zip"
          Invoke-WebRequest https://github.com/mltframework/shotcut/releases/download/v26.9.27/shotcut-win64-26.9.27.zip -OutFile $zip
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash
          if ($hash -ne '1F8C50CE7B125A2F0DCB60777B358E86BAF03B8515982612B6ADAE10A83D93A5') { throw "Shotcut archive checksum mismatch: $hash" }
          Expand-Archive $zip tools/mlt-runtime/package -Force
          if (!(Test-Path tools/mlt-runtime/package/Shotcut/libmlt-7.dll)) { Get-ChildItem tools/mlt-runtime/package; throw 'libmlt-7.dll not where build-editor.ps1 expects it.' }
      - name: Build package
        shell: pwsh
        run: ./scripts/package-windows.ps1
      - name: Zip
        shell: pwsh
        run: |
          $out = "dist/ZenithClipper"
          New-Item -ItemType Directory -Force $out | Out-Null
          Copy-Item build/windows/* $out -Recurse -Force
          New-Item -ItemType Directory -Force "$out/editor" | Out-Null
          Copy-Item build/editor/* "$out/editor" -Recurse -Force
          Copy-Item README.md, THIRD_PARTY.md $out -Force
          Compress-Archive "$out/*" dist/ZenithClipper-windows-x64.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: ZenithClipper-windows-x64
          path: dist/ZenithClipper-windows-x64.zip
      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/ZenithClipper-windows-x64.zip
          generate_release_notes: true
