name: build-and-test
on: [push, pull_request, workflow_dispatch]
jobs:
  core:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet run --project tests/ZenithClipper.Tests
      - run: dotnet build src/ZenithClipper.App -c Release
      - if: runner.os == 'Windows'
        run: dotnet build src/ZenithClipper.Windows -c Release
      - if: runner.os == 'Windows'
        run: dotnet run --project tests/ZenithClipper.Windows.Tests
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          dotnet run --project tests/ZenithClipper.Tests -- /usr/bin/ffmpeg
          python3 -m py_compile linux/*.py
          bash -n scripts/build-linux.sh linux/*.sh
